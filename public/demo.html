<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razorpay-Style Code Reveal Effect Demo — Mazhar Husain Shaikh</title>
  <link rel="stylesheet" href="code-reveal.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050507;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .badge {
      display: inline-block;
      font-family: monospace;
      font-size: 0.75rem;
      background: rgba(204, 255, 0, 0.12);
      color: #ccff00;
      border: 1px solid rgba(204, 255, 0, 0.3);
      padding: 3px 8px;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.875rem;
      color: #a1a1aa;
      line-height: 1.5;
    }
    .portrait-card {
      position: relative;
      background: #0d0d11;
      border: 1px solid #27272a;
      border-radius: 1.25rem;
      padding: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      max-width: 380px;
      width: 100%;
    }
    .card-footer {
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 0.75rem;
      color: #71717a;
      border-top: 1px solid #1f1f23;
      padding-top: 0.75rem;
    }
    .card-footer strong {
      color: #ccff00;
    }
  </style>
</head>
<body>
  <header>
    <div class="badge">RAZORPAY AI BUILDERS HOVER EFFECT</div>
    <h1>Mazhar Husain Shaikh</h1>
    <p>Move your cursor or touch-drag across the portrait to trigger pixel mosaic & flickering code characters with floating info tags.</p>
  </header>

  <div class="portrait-card">
    <!-- Exact Code Reveal Wrapper -->
    <div class="code-reveal" data-code-reveal data-code-theme="lime" style="border-radius: 0.875rem; overflow: hidden; width: 100%;">
      <img src="images/portrait-main-cutout.webp" alt="Mazhar Husain Shaikh" style="width: 100%; height: auto; display: block;">
    </div>

    <div class="card-footer">
      <span>VTU · CLASS OF '27</span>
      <strong>HOVER TO REVEAL CODE</strong>
    </div>
  </div>

  <script src="code-reveal.js"></script>
  <script>
    // Initialized automatically, or call manually:
    // window.CodeReveal.init();
  </script>
</body>
</html>
